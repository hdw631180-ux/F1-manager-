<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Manager 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#05070b;
  --panel:#0d1118;
  --panel2:#121722;
  --line:#1c2433;
  --text:#eef1f6;
  --muted:#8b93a7;
  --a:#e10600;
  --cyan:#2ee6d6;
  --side-w:240px;
  --font:"Inter",system-ui,sans-serif;
  --display:"Orbitron","Inter",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;color:var(--text);font:14.5px/1.5 var(--font);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 80% 50% at 100% -10%, color-mix(in srgb,var(--a) 16%, transparent), transparent 55%),
    radial-gradient(ellipse 60% 40% at -10% 80%, color-mix(in srgb,var(--cyan) 8%, transparent), transparent 50%),
    linear-gradient(180deg,#070a10,#05070b);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.04;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,#fff 2px,#fff 3px);
}
#app{position:relative;z-index:1;min-height:100vh}

/* Shell */
.shell{max-width:1180px;margin:0 auto;padding:24px 18px 48px;animation:shellIn .55s var(--ease) both}
.menu-shell{max-width:1100px}
@keyframes shellIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--a) 45%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes confFall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(var(--r));opacity:0}}

/* Typography */
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.5vw,38px);letter-spacing:.06em;line-height:1.1;margin:0}
h2{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.lead{color:#a4adc0;max-width:48ch;margin:.5em 0 1.2em;font-size:15px}
.mut{color:var(--muted);font-size:13px}
.hero-badge{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:.2em;
  color:var(--cyan);border:1px solid color-mix(in srgb,var(--cyan) 35%,transparent);
  padding:4px 10px;border-radius:4px;margin-bottom:12px;
  animation:rise .5s var(--ease) both;
}

/* Buttons */
button,select{
  font:inherit;font-weight:600;cursor:pointer;color:var(--text);
  background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:9px 16px;
  transition:transform .18s var(--ease),border-color .18s,background .18s,box-shadow .18s;
}
button:hover{border-color:color-mix(in srgb,var(--a) 50%,var(--line));transform:translateY(-1px)}
button:active{transform:scale(.97)}
button:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
button.p{
  background:linear-gradient(135deg,var(--a),#9a0400);
  border-color:transparent;color:#fff;
  box-shadow:0 4px 24px color-mix(in srgb,var(--a) 35%,transparent);
}
button.p:hover{filter:brightness(1.1);box-shadow:0 6px 32px color-mix(in srgb,var(--a) 5 0%,transparent)}
button.p.big{padding:14px 28px;font-size:15px;border-radius:10px}
button.p.pulse{animation:pulse 2s infinite}
button.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
button.ghost:hover{color:var(--text);border-color:var(--muted)}
select{border-radius:8px;min-width:130px}

/* MENU */
.hero{text-align:center;padding:36px 12px 28px;animation:rise .6s var(--ease) both}
.hero h1{
  background:linear-gradient(90deg,#fff 20%,var(--a) 50%,var(--cyan) 80%);
  background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 6s linear infinite;
}
.team-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:8px;
}
.team-card{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;
  animation:rise .5s var(--ease) both;animation-delay:var(--d,0s);
  transition:transform .25s var(--ease),border-color .25s,box-shadow .25s;
}
.team-card:hover{
  transform:translateY(-5px);
  border-color:color-mix(in srgb,var(--tc) 55%,var(--line));
  box-shadow:0 20px 50px #000a,0 0 0 1px color-mix(in srgb,var(--tc) 25%,transparent);
}
.team-stripe{height:4px;background:var(--tc);box-shadow:0 0 20px var(--tc)}
.team-body{padding:16px 16px 18px;display:flex;flex-direction:column;flex:1}
.team-body h3{font-size:16px;font-weight:700;margin-bottom:2px}
.team-meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.drivers{font-size:13px;color:#c5cad6;margin-bottom:14px;flex:1}
.drivers .num{font-weight:700;margin-right:4px}
.drivers em{color:var(--muted);font-style:normal;font-size:11px;margin-left:4px}
.team-body button{width:100%;margin-top:auto}

/* HUB layout */
.hub-shell{display:grid;grid-template-columns:var(--side-w) 1fr;gap:0;max-width:1200px;padding:0;min-height:100vh}
.side{
  background:linear-gradient(180deg,#0a0e16,#070a10);
  border-right:1px solid var(--line);
  padding:20px 14px;display:flex;flex-direction:column;gap:18px;
  position:sticky;top:0;height:100vh;animation:slideL .5s var(--ease) both;
}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.logo-dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 12px currentColor;flex-shrink:0}
.side-brand strong{display:block;font-size:13px;font-weight:700;line-height:1.2}
.side-brand small{color:var(--muted);font-size:11px}
.side-nav{display:flex;flex-direction:column;gap:4px;flex:1}
.side-nav button{
  display:flex;align-items:center;gap:10px;width:100%;
  background:transparent;border:1px solid transparent;border-radius:10px;
  padding:11px 12px;color:var(--muted);font-weight:500;text-align:left;
}
.side-nav button .ic{width:20px;text-align:center;opacity:.7}
.side-nav button:hover{background:#ffffff08;color:var(--text);transform:none}
.side-nav button.on{
  background:color-mix(in srgb,var(--a) 14%,transparent);
  border-color:color-mix(in srgb,var(--a) 30%,transparent);
  color:#fff;box-shadow:inset 3px 0 0 var(--a);
}
.side-foot{display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
.stat-pill{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
}
.stat-pill span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;width:100%}
.stat-pill b{font-family:var(--display);font-size:22px;font-weight:700}
.stat-pill small{color:var(--muted);font-size:12px}
.sfx-tog{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px}

.main-col{padding:22px 22px 40px;animation:rise .55s var(--ease) .05s both}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.season-progress{margin-bottom:10px}
.sp-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sp-bar{height:6px;background:#151a24;border-radius:99px;overflow:hidden;width:min(280px,70vw)}
.sp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--cyan));transform-origin:left;animation:barIn 1s var(--ease) both;border-radius:99px;box-shadow:0 0 12px color-mix(in srgb,var(--a) 40%,transparent)}
.next-card{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  border-left:3px solid var(--a);max-width:360px;
}
.next-card.done{border-left-color:var(--cyan)}
.nc-kicker{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nc-title{font-weight:700;font-size:16px;margin:2px 0}
.nc-meta{font-size:12px;color:var(--muted)}
.tip-bar{
  background:color-mix(in srgb,var(--cyan) 8%,var(--panel));
  border:1px solid color-mix(in srgb,var(--cyan) 20%,var(--line));
  border-radius:10px;padding:10px 14px;font-size:13px;color:#b8c0d0;
  margin-bottom:18px;animation:rise .5s var(--ease) .1s both;
}
.panel{animation:rise .45s var(--ease) both}

/* Cards / grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;
  position:relative;overflow:hidden;
  transition:transform .25s var(--ease),border-color .25s,box-shadow .25s;
}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--a),transparent);opacity:.7}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--a) 35%,var(--line));box-shadow:0 14px 36px #0008}
.card.stagger{animation:rise .45s var(--ease) both;animation-delay:var(--d,0s)}
.card b{font-size:15px;display:block}
.bar{height:7px;background:#151a24;border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),color-mix(in srgb,var(--a) 50%,#fff));border-radius:4px;box-shadow:0 0 10px color-mix(in srgb,var(--a) 40%,transparent);transform-origin:left;animation:barIn .9s var(--ease) both}

/* Compare bars */
.compare{margin:8px 0 20px}
.cmp-rows{display:flex;flex-direction:column;gap:8px}
.cmp-row{display:grid;grid-template-columns:140px 1fr 36px;gap:10px;align-items:center;font-size:13px}
.cmp-row.me .cmp-name{font-weight:700;color:#fff}
.cmp-bar{height:8px;background:#151a24;border-radius:4px;overflow:hidden}
.cmp-bar i{display:block;height:100%;border-radius:4px;transform-origin:left;animation:barIn .8s var(--ease) both}
.cmp-val{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}

.pilot-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.pilot-stats div{background:#0a0e16;border-radius:8px;padding:8px;text-align:center}
.pilot-stats em{display:block;font-style:normal;font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pilot-stats strong{font-size:16px;font-weight:700}

.hist{display:flex;flex-wrap:wrap;gap:8px}
.hist-item{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;
  display:flex;align-items:center;gap:10px;font-size:13px;
}
.hist-gp{color:var(--muted)}
.hist-pos{font-weight:700;font-family:var(--display);font-size:14px}
.pos-1,.pos-2,.pos-3{color:#ffd12e}
.hist-pts{color:var(--cyan);font-weight:600}

/* Tables */
.sc{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#0a0e16}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:#0d1118;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid #ffffff06;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:#ffffff05}
tr.me td{background:color-mix(in srgb,var(--a) 10%,transparent)!important}
tr.me{box-shadow:inset 3px 0 0 var(--a)}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle;box-shadow:0 0 8px currentColor}
.ty{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:50%;border:2px solid currentColor;font:700 11px/1 Arial;margin-right:4px;vertical-align:middle}
.ty.S{color:#e10600;background:#e1060015}.ty.M{color:#ffd12e;background:#ffd12e15}.ty.H{color:#eee;background:#fff2}.ty.I{color:#39b54a;background:#39b54a15}.ty.W{color:#2f6bff;background:#2f6bff15}

.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){
  .hub-shell{grid-template-columns:1fr}
  .side{position:relative;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .side-nav{flex-direction:row;flex-wrap:wrap}
  .side-nav button{width:auto}
  .two{grid-template-columns:1fr}
}

/* Race / live */
.race-shell,.live-shell,.result-shell{max-width:1100px}
.race-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.strat-tip,.tyre-legend{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  margin-bottom:16px;font-size:13px;color:#b0b8c8;
}
.tyre-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}

.live-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.live-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  background:#0d1118;border:1px solid var(--line);border-radius:999px;
  padding:4px 11px;font-size:12px;font-weight:600;color:var(--muted);
}
.badge b{color:var(--text)}
.speed-ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.auto-lab{font-size:12px;color:var(--muted);margin-left:6px}
.ctrl-grid{display:grid;gap:8px;margin-top:10px}
.ctrl-grid label{font-size:11px;color:var(--muted);display:grid;gap:4px}
.ctrl-grid select,.ctrl-grid button{width:100%}
.map-wrap{background:#06080c;border-radius:10px;overflow:hidden;border:1px solid var(--line);box-shadow:inset 0 0 40px #000}
.map-cap{margin-top:8px;font-size:12px}
.timing-card{padding:8px 4px}
.race-log{
  margin-top:14px;max-height:130px;overflow-y:auto;font-size:12.5px;color:var(--muted);
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.55;
}

/* Live rows */
.rw{position:absolute;left:0;right:0;height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:8px;transition:transform .7s var(--ease);font-size:13px}
.rw b{width:24px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.rw .nm{flex:1;font-weight:500}
.rw .gp{width:78px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.rw.me{background:color-mix(in srgb,var(--a) 16%,transparent);box-shadow:inset 3px 0 0 var(--a)}
.rw.ko{opacity:.35}

.lr{display:grid;grid-template-columns:28px 1fr 74px 40px;gap:8px;align-items:center;padding:7px 12px;border-radius:10px;animation:rise .35s var(--ease) both;animation-delay:var(--d)}
.lr.me{background:color-mix(in srgb,var(--a) 12%,transparent)}

/* Results */
.result-summary{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0;
}
.rs-item{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;
  animation:rise .45s var(--ease) both;
}
.rs-item em{display:block;font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.rs-item strong{font-family:var(--display);font-size:24px;font-weight:700}
.rs-item.pos strong{color:#3dd68c}
.rs-item.neg strong{color:#ff6b6b}
.champ-banner{
  text-align:center;padding:28px;margin-bottom:20px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--a) 20%,var(--panel)),var(--panel));
  border:1px solid color-mix(in srgb,var(--a) 30%,var(--line));border-radius:16px;
  animation:rise .5s var(--ease) both;
}
.cb-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.cb-name{font-family:var(--display);font-size:28px;font-weight:800;margin:6px 0}
.cb-sub{color:var(--muted)}

/* Confetti */
.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.confetti-layer i{
  position:absolute;top:-5vh;width:8px;height:12px;background:var(--c);
  left:var(--x);animation:confFall var(--d) linear forwards;
  border-radius:2px;
}

/* Toasts */
#toasts{position:fixed;right:16px;top:16px;display:grid;gap:10px;z-index:50;max-width:320px}
.toast{
  background:#121722f0;backdrop-filter:blur(12px);
  border:1px solid var(--line);border-left:3px solid var(--a);
  padding:12px 14px;border-radius:10px;box-shadow:0 12px 40px #000a;
  animation:rise .3s var(--ease) both,toastOut .4s 3.5s forwards;
  font-size:13px;
}
@keyframes toastOut{to{opacity:0;transform:translateX(36px)}}

svg text{font:3.2px var(--font);fill:#fff;text-anchor:middle;pointer-events:none;opacity:.9}
.foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:#5a6272}
.foot small{color:inherit;display:block}

input[type=range]{width:100%;accent-color:var(--a);margin:8px 0}
input[type=number]{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit}

@media(max-width:600px){
  .result-summary{grid-template-columns:1fr}
  .pilot-stats{grid-template-columns:repeat(2,1fr)}
  .cmp-row{grid-template-columns:1fr;gap:4px}
}

</style>
</head>
<body>
<div id="toasts"></div>
<div id="app"></div>
<script>

const $=q=>document.querySelector(q),ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),A=$('#app');
// Écuries, pilotes, numéros, nationalités : saison 2026. Niveau voiture & stats [pure,course,régularité,dépassement,pneus,pluie] : estimations du jeu.
const T=[
["Red Bull Racing","#3671C6",84,"Ford",[["Max Verstappen",3,"NED",98,97,94,95,90,93],["Isack Hadjar",6,"FRA",82,80,72,76,74,72]]],
["Racing Bulls","#6692FF",72,"Ford",[["Liam Lawson",30,"NZL",80,80,76,78,76,74],["Arvid Lindblad",41,"GBR",78,76,70,74,72,70]]],
["Mercedes","#27F4D2",90,"Mercedes",[["George Russell",63,"GBR",92,91,92,86,88,88],["Kimi Antonelli",12,"ITA",90,86,78,84,80,86]]],
["Ferrari","#E80020",86,"Ferrari",[["Charles Leclerc",16,"MON",95,92,86,88,86,88],["Lewis Hamilton",44,"GBR",91,91,92,90,92,95]]],
["McLaren","#FF8000",86,"Mercedes",[["Lando Norris",1,"GBR",94,94,90,88,90,86],["Oscar Piastri",81,"AUS",93,92,92,90,88,84]]],
["Aston Martin","#229971",70,"Honda",[["Fernando Alonso",14,"ESP",91,93,92,96,92,94],["Lance Stroll",18,"CAN",78,76,72,70,72,82]]],
["Alpine","#0093CC",68,"Mercedes",[["Pierre Gasly",10,"FRA",86,86,85,82,84,86],["Franco Colapinto",43,"ARG",80,78,70,76,72,74]]],
["Williams","#64C4FF",73,"Mercedes",[["Alexander Albon",23,"THA",86,86,88,84,88,84],["Carlos Sainz",55,"ESP",88,88,90,86,88,84]]],
["Haas","#B6BABD",68,"Ferrari",[["Esteban Ocon",31,"FRA",84,83,82,82,80,82],["Oliver Bearman",87,"GBR",82,82,78,80,78,78]]],
["Audi","#C8102E",70,"Audi",[["Nico Hülkenberg",27,"GER",85,85,86,84,84,88],["Gabriel Bortoleto",5,"BRA",82,81,76,80,78,76]]],

  <nav class="side-nav">${[['eq','Écurie','⚙'],['pi','Pilotes','👤'],['ca','Calendrier','📅'],['cl','Classements','🏆'],['st','Staff','🧠']].map(([k,n,ic])=>`<button class="${k==tab?'on':''}" onclick="sfx('click');hub('${k}')"><span class="ic">${ic}</span>${n}</button>`).join('')}
  <button class="ghost" onclick="sfx('click');menu()">← Menu</button></nav>
  <div class="side-foot">
    <div class="stat-pill"><span>Budget</span><b id="bud">${Math.round(G.$)}</b><small>M$</small></div>
    <div class="stat-pill"><span>Constructeurs</span><b>${myRank}<sup>e</sup></b></div>
    <label class="sfx-tog"><input type="checkbox" ${G.sfx?'checked':''} onchange="G.sfx=this.checked;save()"> Sons</label>
  </div>
</aside>
<div class="main-col">
  <header class="topbar">
    <div>
      <div class="season-progress"><div class="sp-label">Saison ${G.r}/24</div><div class="sp-bar"><i style="width:${pct}%"></i></div></div>
      ${done?`<div class="next-card done">Saison terminée</div>`:`<div class="next-card"><div class="nc-kicker">Prochain GP</div><div class="nc-title">${next[0]}</div><div class="nc-meta">${next[1]} · ${next[2]} · ${next[3]} tours · dépass. ${Math.round(next[6]*100)}%</div></div>`}
    </div>
    <div class="top-actions">${done?`<button class="p" onclick="sfx('click');menu()">Nouvelle saison</button>`:`<button class="p pulse" onclick="sfx('click');pre()">Aller au Grand Prix →</button>`}</div>
  </header>
  <div class="tip-bar">💡 ${tip()}</div>
  <section class="panel view-${tab}">${V[tab]()}</section>
  <footer class="foot">${note}</footer>
</div></div>`}
function pre(){const c=CAL[G.r];R={c,lap:0,laps:c[3],base:c[4],rain:!!G.rainF||Math.random()<.2,wet:0,sc:0,log:[],cars:[]};R.wet=R.rain?1:0;
const q=D.map(d=>[d,.6*avg(d.ti)+.4*d.s[0]+(Math.random()-.5)*5]).sort((a,b)=>b[1]-a[1]);
R.cars=q.map(([d],i)=>{const ty=R.rain?'I':['S','M','M','H'][ri(0,3)];return{d,tot:i*.35,tyre:ty,age:0,stops:0,used:{[ty]:1},mode:1,out:0,pit:null,w:0,dg:0,tgt:78+ri(0,18)}});
R.mi=R.cars.map((x,i)=>x.d.ti==G.t?i:-1).filter(i=>i>=0);
const op=v=>['S','M','H','I','W'].map(k=>`<option ${k==v?'selected':''} value=${k}>${{S:'Tendre',M:'Medium',H:'Dur',I:'Intermédiaire',W:'Pluie extrême'}[k]}</option>`).join('');
document.body.className='page-race';
const stratTip=R.rain?'Piste humide : privilégie Intermédiaire, surveille le séchage.':(c[6]<.2?'Circuit difficile à dépasser : mise sur la qualif et les arrêts sous SC.':'Bons dépassements possibles : pneus tendres utiles en fin de stint.');
A.innerHTML=`<div class="shell race-shell"><header class="race-head"><div><div class="hero-badge">${R.rain?'🌧 HUMIDE':'☀ SEC'}</div><h1>GP ${c[0]}</h1><p class="lead">${c[1]} · ${c[3]} tours · ${c[2]}</p></div><button class="ghost" onclick="sfx('click');hub('eq')">← QG</button></header>
<div class="strat-tip">📋 ${stratTip}</div>
<h2>Grille de départ</h2><div class="sc"><table><thead><tr><th>Pos</th><th>Pilote</th><th>Écurie</th></tr></thead><tbody>${R.cars.map((x,i)=>`<tr class="${x.d.ti==G.t?'me':''}"><td>${i+1}</td><td><i class="dot" style="background:${T[x.d.ti][1]}"></i>#${x.d.n} ${x.d.name}</td><td>${T[x.d.ti][0]}</td></tr>`).join('')}</tbody></table></div>
<h2>Pneus de départ</h2><div class="grid">${R.mi.map((m,i)=>`<div class="card"><b>${R.cars[m].d.name}</b><div style="margin-top:10px"><select id="st${i}">${op(R.cars[m].tyre)}</select></div></div>`).join('')}</div>
<div class="tyre-legend"><span class="ty S">S</span> Tendre <span class="ty M">M</span> Medium <span class="ty H">H</span> Dur <span class="ty I">I</span> Inter <span class="ty W">W</span> Wet · En sec : 2 composés min.</div>
<p class="actions"><button class="p big" onclick="sfx('click');go()">⚑ Feu vert</button></p></div>`}
function go(){R.mi.forEach((m,i)=>{const x=R.cars[m],t=$('#st'+i).value;x.tyre=t;x.used={[t]:1};x.tgt=78+ri(0,18)});
const op=['S','M','H','I','W'].map(k=>`<option value=${k}>${{S:'Tendre',M:'Medium',H:'Dur',I:'Intermédiaire',W:'Pluie extrême'}[k]}</option>`).join('');
document.body.className='page-live';
A.innerHTML=`<div class="shell live-shell">
<header class="live-head">
  <div><h1>GP ${R.c[0]}</h1>
  <div class="live-meta"><span class="badge" id="lapbadge">Tour <b id="lp">0</b>/${R.laps}</span><span class="badge" id="sts"></span><span class="badge" id="spd">×1</span></div></div>
  <div class="speed-ctrl">
    <button onclick="sfx('click');sp(0)">×1</button>
    <button onclick="sfx('click');sp(1)">×4</button>
    <button onclick="sfx('click');sp(2)">×16</button>
    <button class="p" onclick="sfx('click');while(!R.fin)tick()">Terminer</button>
    ${G.st?`<label class="auto-lab"><input type="checkbox" onchange="R.auto=this.checked"> Auto ${G.st[0]}</label>`:''}
  </div>
</header>
<div class="grid pilot-ctrl">${R.mi.map((m,i)=>`<div class="card"><b>#${R.cars[m].d.n} ${R.cars[m].d.name}</b>
<div class="ctrl-grid">
<label>Allure<select onchange="R.cars[${m}].mode=+this.value"><option value=0>Attaque</option><option value=1 selected>Normal</option><option value=2>Économie</option></select></label>
<label>Prochains pneus<select id="nx${i}">${op}</select></label>
<button id="bx${i}" onclick="sfx('click');box(${m},${i})">Box au prochain tour</button>
</div></div>`).join('')}</div>
<div class="two live-boards">
  <div class="card map-card"><div class="map-wrap"><svg id="map" viewBox="0 0 100 60" width="100%"></svg></div><div class="mut map-cap">${R.c[1]} · ${REAL[G.r]?'Tracé réel':'Schéma'} · ○ = ton écurie</div></div>
  <div class="card timing-card"><div id="tw" style="position:relative;height:616px"></div></div>
</div>
<div id="lg" class="race-log"></div>
</div>`;
R.fin=0;initMap();draw();sp(0);anim()}
function initMap(){$('#tw').innerHTML=R.cars.map((x,i)=>`<div class=rw id=r${i}></div>`).join('');const d=pathOf((REAL[G.r]||MAP[G.r]).split(',').map(p=>p.split(' ').map(Number)));
$('#map').innerHTML=`<path d="${d}" fill=none stroke="#2a2e36" stroke-width=5.5 stroke-linejoin=round /><path id=tp d="${d}" fill=none stroke="#5b616c" stroke-width=3.6 stroke-linejoin=round /><circle id=sf r=1.3 fill="#fff" />${R.cars.map((x,i)=>{const m=x.d.ti==G.t;return `<g id=c${i}><title>#${x.d.n} ${x.d.name}</title><circle r=${m?2.8:1.7} fill="${T[x.d.ti][1]}" ${m?'stroke="#fff" stroke-width=.7':''} />${m?`<text y=1>${x.d.n}</text>`:''}</g>`}).join('')}`;
R.trk=$('#tp');R.len=R.trk.getTotalLength();const s=R.trk.getPointAtLength(0);$('#sf').setAttribute('cx',s.x);$('#sf').setAttribute('cy',s.y);R.el=R.cars.map((x,i)=>$('#c'+i));R.ms=700}
function anim(){if(R.fin)return;const k=Math.min(1,(performance.now()-R.t0)/R.ms);
R.cars.forEach((x,i)=>{const e=R.el[i];if(x.out){e.style.display='none';return}x.pd=x.pa+(x.pb-x.pa)*k;const p=R.trk.getPointAtLength((((x.pd%1)+1)%1)*R.len);e.setAttribute('transform',`translate(${p.x} ${p.y})`)});requestAnimationFrame(anim)}
const sp=i=>{clearInterval(R.iv);R.ms=[700,180,40][i];R.iv=setInterval(tick,R.ms);const el=$('#spd');if(el)el.textContent=['×1','×4','×16'][i]};
function box(m,i){const x=R.cars[m];x.pit=x.pit?null:$('#nx'+i).value;draw()}
const lg=(m,me)=>{R.log.unshift(`Tour ${R.lap} : ${m}`);R.log=R.log.slice(0,6);if(me)toast(m)};
function lapT(x){const car=G.car[x.d.ti],s=x.d.s,b=R.base,k=C[x.tyre],dm=[1.35,1,.75][x.mode];
let lt=b*(1+(100-(.6*avg(x.d.ti)+.4*s[1]))*.0006+k.o);
lt+=b*k.d*k.l*(x.w/100)+(x.w>85?b*.0008*(x.w-85):0)+x.dg*b;
lt-=b*(R.laps-R.lap)*.00008;
if(R.rain)lt+=b*((x.tyre=='I'?.12:x.tyre=='W'?.15:.35)-(s[5]-80)*.001);else if(x.tyre=='I'||x.tyre=='W')lt+=b*.14;
return (lt+(Math.random()-.5)*(.3+(100-s[2])*.02))*(1+[-.004,0,.005][x.mode])}
function ai(x){if(x.d.ti==G.t&&R.sc&&G.st&&G.st[1]>=75&&x.w>45&&R.laps-R.lap>6&&!x.pit&&x.tyre!='I'&&x.tyre!='W'){x.pit=R.laps-R.lap>30?'H':'M';return}const rem=R.laps-R.lap,dry=Object.keys(x.used).filter(k=>k!='I').length;
if(R.rain&&x.tyre!='I'&&rem>3)x.pit='I';else if(!R.rain&&x.tyre=='I'&&Math.random()<.4)x.pit='M';
else if(x.tyre!='I'&&rem>4&&(x.w>=x.tgt||(dry<2&&!R.rain&&!R.wet&&R.lap>=R.laps*.55))){x.pit=rem>34?'H':rem>14?'M':'S';if(!R.wet&&dry<2&&x.used[x.pit])x.pit=['S','M','H'].find(k=>!x.used[k])}}
function tick(){if(R.fin)return;R.lap++;
if(!R.rain&&Math.random()<.004){R.rain=1;R.wet=1;lg('🌧 Il commence à pleuvoir')}else if(R.rain&&Math.random()<.02){R.rain=0;lg('☀ La piste sèche')}
const L=R.cars.filter(x=>!x.out).sort((a,b)=>a.tot-b.tot);
if(R.sc){R.sc--;if(!R.sc)lg('🟢 Reprise de la course')}else if(R.lap>1&&R.lap<R.laps-2&&Math.random()<R.c[5]){R.sc=4;lg('🟡 Voiture de sécurité');L.forEach((x,i)=>x.tot=L[0].tot+i*.8)}
let pv=null;
L.forEach(x=>{if(inc(x))return;
if((x.d.ti!==G.t||R.auto)&&!x.pit)ai(x);
let lt=R.sc?R.base*1.4:lapT(x);
if(x.pit){lt+=21*(R.sc?.55:1);x.tyre=x.pit;x.pit=null;x.age=0;x.w=0;x.stops++;x.used[x.tyre]=1;x.tgt=78+ri(0,18)}
x.age++;x.w=Math.min(130,x.w+100/C[x.tyre].l*[1.35,1,.75][x.mode]*(1.25-x.d.s[4]/200)*(R.sc?.4:1)*((R.rain?(x.tyre=='I'||x.tyre=='W'):(x.tyre!='I'&&x.tyre!='W'))?1:1.8));x.lt=lt;x.nt=x.tot+lt;
if(pv){const lim=pv.nt+.3;if(R.sc)x.nt=Math.max(x.nt,lim);else if(x.nt<lim){const P=Math.min(.9,R.c[6]*(.4+x.d.s[3]/100)*(1+Math.max(0,pv.lt-x.lt)*1.5));if(Math.random()>=P)x.nt=lim}}
pv=x});
L.forEach(x=>{if(!x.out)x.tot=x.nt});
draw();if(R.lap>=R.laps)fin()}
function draw(){const live=R.cars.filter(x=>!x.out).sort((a,b)=>a.tot-b.tot),ko=R.cars.filter(x=>x.out),l0=live[0].tot;
const lav=live[0].lt||R.base;R.t0=performance.now();
R.cars.forEach(x=>{if(x.out)return;const pt=R.lap-(x.tot-l0)/lav;x.pa=x.pd===undefined?pt:x.pd;x.pb=pt});
$('#lp').textContent=R.lap;$('#sts').textContent=(R.sc?'🟡 Voiture de sécurité':'🟢 Course')+(R.rain?' — 🌧 Pluie':' — ☀ Sec');
R.mi.forEach((m,i)=>{$('#bx'+i).textContent=R.cars[m].pit?'Box confirmé : annuler':'Box au prochain tour';$('#bx'+i).disabled=!!R.cars[m].out});
R.cars.forEach((x,i)=>{const e=$('#r'+i),p=x.out?live.length+ko.indexOf(x):live.indexOf(x);e.style.transform=`translateY(${p*28}px)`;e.className='rw'+(x.d.ti==G.t?' me':'')+(x.out?' ko':'');e.innerHTML=`<b>${x.out?'-':p+1}</b><i class=dot style="background:${T[x.d.ti][1]}"></i><span class=nm>${ln(x.d)}</span><span class=gp>${x.out?'Abandon':p?'+'+fm(x.tot-l0):'Leader'}</span><span><i class="ty ${x.tyre}">${x.tyre}</i>${Math.round(x.w)}%</span>`});
$('#lg').innerHTML=R.log.join('<br>')}
function fin(){R.fin=1;clearInterval(R.iv);
R.cars.forEach(x=>{if(!x.out&&!R.wet&&Object.keys(x.used).filter(k=>k!='I').length<2){x.tot+=20;x.pen=1}});
const cl=[...R.cars.filter(x=>!x.out).sort((a,b)=>a.tot-b.tot),...R.cars.filter(x=>x.out).sort((a,b)=>b.out-a.out)];let mine=0;
cl.forEach((x,i)=>{const p=x.out?0:PTS[i]||0;G.dp[x.d.id]+=p;G.tp[x.d.ti]+=p;if(x.d.ti==G.t)mine+=p});
T.forEach((t,i)=>{if(i!=G.t&&Math.random()<.5){const k='apcf'[ri(0,3)];G.car[i][k]=Math.min(99,G.car[i][k]+1)}});
const rk=rank(G.tp,G.t),gain=Math.round(6+(11-rk)*1.8+mine*.4-5-(G.st?G.st[2]:0));G.$+=gain;G.w[G.r]=ln(cl[0].d);
const myBest=cl.findIndex(x=>x.d.ti==G.t&&!x.out);const myPos=myBest>=0?myBest+1:(cl.findIndex(x=>x.d.ti==G.t)+1);
G.hist=G.hist||[];G.hist.push({gp:R.c[0],pos:myPos,pts:mine});
G.r++;save();
if(myPos<=3){sfx('podium');confetti()}else sfx('click');
document.body.className='page-result';
A.innerHTML=`<div class="shell result-shell"><header class="race-head"><div><div class="hero-badge">RÉSULTATS</div><h1>GP ${R.c[0]}</h1></div></header>
<div class="sc"><table><thead><tr><th>Pos</th><th>Pilote</th><th>Écurie</th><th>Écart</th><th>Pts</th></tr></thead><tbody>${cl.map((x,i)=>`<tr class="${x.d.ti==G.t?'me':''}"><td>${x.out?'—':i+1}</td><td><i class="dot" style="background:${T[x.d.ti][1]}"></i>${x.d.name}</td><td>${T[x.d.ti][0]}</td><td>${x.out?'Abandon (T'+x.out+')':(i?'+'+fm(x.tot-cl[0].tot):'🏆 Vainqueur')+(x.pen?' · +20s':'')}</td><td><b>${x.out?0:PTS[i]||0}</b></td></tr>`).join('')}</tbody></table></div>
<div class="result-summary">
  <div class="rs-item"><em>Points écurie</em><strong>${mine}</strong></div>
  <div class="rs-item"><em>Constructeurs</em><strong>${rk}<sup>e</sup></strong></div>
  <div class="rs-item ${gain>=0?'pos':'neg'}"><em>Bilan</em><strong>${gain>=0?'+':''}${gain} M$</strong></div>
</div>
<p class="actions"><button class="p" onclick="sfx('click');hub('eq')">Retour au QG</button> <button onclick="sfx('click');hub('cl')">Classements</button></p></div>`}
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;
if(e.key==='g'||e.key==='G'){if(G&&G.r<24&&!R?.iv)pre()}
if(e.key>='1'&&e.key<='5'&&G){const tabs=['eq','pi','ca','cl','st'];hub(tabs[+e.key-1])}
});
menu();loadReal();

</script>
</body>
</html>
