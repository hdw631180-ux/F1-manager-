<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Manager 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#07090d;
  --bg2:#0c0f14;
  --panel:#12151ce6;
  --panel2:#161a22;
  --border:#ffffff12;
  --border2:#ffffff1f;
  --text:#f0f1f3;
  --muted:#8b919c;
  --a:#e10600;
  --glow:color-mix(in srgb,var(--a) 45%,transparent);
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 12px 40px #00000080;
  --font:"Inter",system-ui,-apple-system,sans-serif;
  --display:"Orbitron","Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse 900px 500px at 90% -5%, color-mix(in srgb,var(--a) 18%, transparent), transparent 70%),
    radial-gradient(ellipse 700px 400px at 5% 30%, color-mix(in srgb,var(--a) 8%, transparent), transparent 65%),
    linear-gradient(180deg,#0a0c11 0%,#07090d 40%,#050608 100%);
  color:var(--text);
  font:15px/1.5 var(--font);
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  opacity:.7;
}
#app{position:relative;z-index:1;min-height:100vh}
main{
  max-width:1040px;
  margin:0 auto;
  padding:28px 20px 60px;
  animation:pageIn .5s cubic-bezier(.22,1,.36,1) both;
}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes barFill{from{width:0}}

h1{
  font-family:var(--display);
  font-weight:800;
  font-size:clamp(28px,5vw,40px);
  letter-spacing:.04em;
  line-height:1.15;
  background:linear-gradient(135deg,#fff 30%,color-mix(in srgb,var(--a) 70%,#fff));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  margin:0 0 .15em;
}
h2{
  font-family:var(--display);
  font-size:13px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  margin:28px 0 12px;
  display:flex;align-items:center;gap:10px;
}
h2::after{
  content:"";flex:1;height:1px;
  background:linear-gradient(90deg,var(--border2),transparent);
}
.mut{color:var(--muted);font-size:13.5px}
.lead{font-size:15px;color:#b0b5be;max-width:54ch;margin:.35em 0 1.3em;line-height:1.55}

button,select{
  font:inherit;font-weight:500;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border2);
  border-radius:999px;
  padding:9px 18px;
  cursor:pointer;
  transition:all .22s cubic-bezier(.22,1,.36,1);
}
button:hover{border-color:color-mix(in srgb,var(--a) 55%,#fff);background:#1c212b;transform:translateY(-1px)}
button:active{transform:scale(.97)}
button:disabled{opacity:.38;cursor:not-allowed;transform:none!important}
button.p{
  background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 65%,#000));
  border-color:transparent;
  color:#fff;
  font-weight:600;
  box-shadow:0 4px 20px color-mix(in srgb,var(--a) 40%,transparent);
}
button.p:hover{
  filter:brightness(1.08);
  box-shadow:0 6px 28px color-mix(in srgb,var(--a) 55%,transparent);
  transform:translateY(-2px);
}
select{border-radius:10px;padding:8px 12px;min-width:140px}

.tabs{
  display:flex;flex-wrap:wrap;gap:4px;
  margin:20px 0 6px;
  padding:5px;
  background:#0e1118;
  border:1px solid var(--border);
  border-radius:999px;
  width:fit-content;
  max-width:100%;
}
.tabs button{
  border:none;background:transparent;
  padding:8px 15px;font-size:13px;font-weight:500;
  color:var(--muted);border-radius:999px;
}
.tabs button:hover{color:var(--text);background:#ffffff0a;transform:none}
.tabs .on,.tabs button.on{
  background:var(--a)!important;
  color:#fff!important;
  box-shadow:0 2px 14px color-mix(in srgb,var(--a) 50%,transparent);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(235px,1fr));
  gap:14px;
  margin-top:6px;
}
.card{
  background:linear-gradient(165deg,#161a23f2,#0f1218f8);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  position:relative;
  overflow:hidden;
  transition:transform .3s cubic-bezier(.22,1,.36,1),border-color .3s,box-shadow .3s;
  animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both;
}
.card::before{
  content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--a),color-mix(in srgb,var(--a) 25%,transparent));
  opacity:.9;
}
.card:hover{
  transform:translateY(-4px);
  border-color:color-mix(in srgb,var(--a) 40%,var(--border2));
  box-shadow:0 18px 44px #000000a0,0 0 0 1px color-mix(in srgb,var(--a) 12%,transparent);
}
.card b{font-weight:700;font-size:15.5px;display:block;margin-bottom:2px}
.card .mut{font-size:12.5px;margin-bottom:6px}
.card p{margin-top:14px}

.bar{
  height:7px;background:#1a1e27;border-radius:4px;overflow:hidden;margin:8px 0 4px;
  box-shadow:inset 0 1px 2px #0006;
}
.bar i{
  display:block;height:100%;
  background:linear-gradient(90deg,var(--a),color-mix(in srgb,var(--a) 55%,#fff));
  border-radius:4px;
  box-shadow:0 0 12px var(--glow);
  transition:width .85s cubic-bezier(.22,1,.36,1);
}

.sc{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border);margin:8px 0;background:#0c0f14}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;padding:11px 12px;
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);background:#0e1118;
  border-bottom:1px solid var(--border2);
}
td{padding:10px 12px;border-bottom:1px solid #ffffff08;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:#ffffff06}
tr.me td{background:color-mix(in srgb,var(--a) 11%,transparent)!important}
tr.me{box-shadow:inset 3px 0 0 var(--a)}

.dot{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  margin-right:8px;vertical-align:middle;
  box-shadow:0 0 8px currentColor;
}

.ty{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;border-radius:50%;
  border:2px solid currentColor;font:700 11px/1 Arial;
  margin-right:6px;vertical-align:middle;
}
.ty.S{color:#e10600;background:#e1060018}
.ty.M{color:#ffd12e;background:#ffd12e18}
.ty.H{color:#e8e8e8;background:#ffffff12}
.ty.I{color:#39b54a;background:#39b54a18}
.ty.W{color:#2f6bff;background:#2f6bff18}

.rw{
  position:absolute;left:0;right:0;height:30px;
  display:flex;align-items:center;gap:8px;
  padding:0 10px;border-radius:8px;
  transition:transform .75s cubic-bezier(.22,1,.36,1);
  font-size:13.5px;
}
.rw b{width:24px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.rw .nm{flex:1;font-weight:500}
.rw .gp{width:78px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.rw.me{background:color-mix(in srgb,var(--a) 16%,transparent);box-shadow:inset 3px 0 0 var(--a)}
.rw.ko{opacity:.35}

.lr{
  display:grid;grid-template-columns:28px 1fr 74px 40px;gap:8px;align-items:center;
  padding:7px 12px;border-radius:10px;
  animation:fadeUp .4s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d);
}
.lr.me{background:color-mix(in srgb,var(--a) 12%,transparent)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:780px){.two{grid-template-columns:1fr}}

.hub-head{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
  padding-bottom:4px;
}
.hub-head .meta{
  display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:8px;font-size:13px;color:var(--muted);
}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  background:#ffffff0a;border:1px solid var(--border);
  padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:500;
}
.badge strong{color:var(--text);font-weight:600}

#toasts{position:fixed;right:16px;top:16px;display:grid;gap:10px;z-index:50;max-width:320px}
.toast{
  background:#161a22f5;backdrop-filter:blur(14px);
  border:1px solid var(--border2);border-left:4px solid var(--a);
  padding:12px 16px;border-radius:12px;
  box-shadow:var(--shadow);
  animation:pageIn .35s both,toastOut .4s 3.5s forwards;
  font-size:13.5px;
}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}

svg text{font:3.2px var(--font);fill:#fff;text-anchor:middle;pointer-events:none;opacity:.9}
#map-wrap{
  background:#080a0e;border:1px solid var(--border);
  border-radius:12px;overflow:hidden;
  box-shadow:inset 0 0 50px #000a;
}

.note{
  margin-top:44px;padding-top:18px;
  border-top:1px solid var(--border);
  font-size:12px;color:#5c636e;line-height:1.65;
}
.note small{color:inherit;display:block;margin-top:0}
.menu-hero{margin-bottom:6px}

.sc::-webkit-scrollbar{height:6px}
.sc::-webkit-scrollbar-thumb{background:#ffffff20;border-radius:3px}

input[type=range]{width:100%;accent-color:var(--a);margin:8px 0}
input[type=number]{
  background:var(--panel2);border:1px solid var(--border2);
  color:var(--text);border-radius:8px;padding:7px 10px;font:inherit;
}
label{cursor:pointer}

</style>
</head>

function lapT(x){const car=G.car[x.d.ti],s=x.d.s,b=R.base,k=C[x.tyre],dm=[1.35,1,.75][x.mode];

if(R.sc){R.sc--;if(!R.sc)lg('🟢 Reprise de la course')}else if(R.lap>1&&R.lap<R.laps-2&&Math.random()<R.c[5]){R.sc=4;lg('🟡 Voiture de sécurité');L.forEach((x,i)=>x.tot=L[0].tot+i*.8)}
