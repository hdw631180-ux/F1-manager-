<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Manager 2026</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1100px 560px at 85% -10%,color-mix(in srgb,var(--a,#e10600) 24%,#101216),#0b0d11 62%) fixed;color:#ecebe7;font:15px/1.4 "Bahnschrift","Segoe UI",system-ui,sans-serif}
button,select{font:inherit;background:#232730;color:inherit;border:1px solid #343944;border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--a,#e10600)}button.p,.tabs .on{background:var(--a,#e10600);border-color:var(--a,#e10600);color:#fff}
button:disabled{opacity:.4;cursor:default}
main{max-width:980px;margin:0 auto;padding:16px}h1{font-size:34px;margin:.2em 0;letter-spacing:.5px}h2{font-size:20px;margin:1.2em 0 .4em}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
table{width:100%;border-collapse:collapse}td,th{padding:5px 8px;border-bottom:1px solid #2a2e36;text-align:left;white-space:nowrap}
.sc{overflow-x:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:linear-gradient(160deg,#1e222acc,#14171dcc);backdrop-filter:blur(6px);border:1px solid #ffffff1a;border-radius:14px;padding:14px;transition:transform .25s,border-color .25s,box-shadow .25s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px #0008;border-color:var(--a,#e10600)}
.bar{height:6px;background:#2a2e36;border-radius:3px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--a,#e10600)}
.dot{display:inline-block;width:4px;height:14px;margin-right:6px;vertical-align:middle}
.mut{color:#9a9ea8}.me{background:#ffffff14}
main{animation:in .45s ease both}@keyframes in{from{opacity:0;transform:translateY(10px)}}@keyframes out{to{opacity:0;transform:translateX(30px)}}
button{transition:.2s}button:active{transform:scale(.95)}.bar i{transition:width .7s cubic-bezier(.3,.8,.3,1)}
#toasts{position:fixed;right:12px;top:12px;display:grid;gap:8px;z-index:9}.toast{background:#1c2028;border-left:4px solid var(--a,#e10600);padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px #000a;animation:in .3s both,out .4s 3.6s forwards}
.rw{position:absolute;left:0;right:0;height:26px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:8px;transition:transform .8s cubic-bezier(.3,.8,.3,1)}.rw b{width:22px}.rw .nm{flex:1}.rw .gp{width:72px;text-align:right}.rw.me{background:#ffffff1c}.rw.ko{opacity:.4}
.ty{display:inline-block;min-width:20px;text-align:center;border-radius:50%;border:2px solid currentColor;font:700 11px/16px Arial;margin-right:5px}.ty.S{color:#e10600}.ty.M{color:#ffd12e}.ty.H{color:#fff}.ty.I{color:#39b54a}.ty.W{color:#2f6bff}
.lr{display:grid;grid-template-columns:26px 1fr 70px 36px;gap:8px;align-items:center;padding:4px 8px;border-radius:8px;animation:in .4s both;animation-delay:var(--d)}.lr.me{background:#ffffff14}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}@media(max-width:760px){.two{grid-template-columns:1fr}}
svg text{font:3px Arial,sans-serif;fill:#fff;text-anchor:middle;pointer-events:none}small{color:#9a9ea8;display:block;margin-top:24px}
</style></head><body><div id="toasts"></div><div id="app"></div>

const C={S:{o:0,d:.00075,l:16},M:{o:.007,d:.0004,l:27},H:{o:.012,d:.0002,l:40},I:{o:0,d:.0003,l:35},W:{o:.04,d:.0002,l:40}},PTS=[25,18,15,12,10,8,6,4,2,1];
const note=`<small>Noms des écuries, pilotes, numéros, nationalités, circuits et calendrier : saison 2026. Statistiques des pilotes, niveaux des voitures et durées de tour : estimations du jeu, non officielles.</small>`;
// Tracés schématiques (points de contrôle, même ordre que CAL) : formes approximatives, non à l'échelle, ce ne sont pas les plans officiels.
const MAP=["20 40,14 26,26 12,50 10,76 14,86 26,78 38,64 42,56 50,38 50","12 18,12 32,24 38,34 26,26 16,44 12,60 24,86 44,90 34,74 30,86 14,56 8,34 8","20 40,12 28,24 14,40 18,52 30,44 42,60 48,80 44,88 32,76 20,64 22,56 34,40 40,28 44","18 40,12 28,24 18,44 14,72 12,86 22,80 34,70 42,78 48,60 52,44 46,32 50","10 44,8 24,14 12,30 16,50 10,70 14,90 12,92 28,80 24,70 36,56 46,42 46,26 50","16 44,10 32,20 18,34 24,40 12,56 22,72 14,88 26,84 40,68 46,54 50,40 46,30 52","12 36,22 14,50 12,84 16,90 30,76 36,50 44,40 50,24 52,12 46","16 42,10 30,22 20,38 24,50 12,64 18,74 28,64 38,78 46,60 50,40 48,24 52","18 44,10 32,24 20,44 16,60 22,72 12,90 22,92 36,78 40,66 50,44 50,30 46","20 40,14 22,38 12,60 16,84 12,88 30,70 38,60 50,38 52,24 48","20 42,12 28,26 16,44 22,58 12,74 20,88 32,80 42,66 36,54 50,40 50,30 46","14 42,10 22,26 14,34 26,52 10,72 18,92 30,84 44,66 40,54 52,36 52,22 48","20 42,12 30,24 16,40 22,56 14,70 22,84 34,72 44,62 36,50 50,36 46,28 52","18 42,12 30,26 14,42 22,56 12,70 24,82 36,68 46,56 38,44 50,30 48,22 46","14 44,14 26,48 10,52 10,60 16,62 30,80 44,86 30,86 24,66 38,60 36,30 44","20 40,14 28,26 20,38 24,50 14,66 18,78 28,88 40,76 46,64 38,52 50,40 50,28 46","10 44,8 28,36 26,40 14,54 18,60 30,88 24,90 38,70 44,56 52,34 54,20 50","18 44,12 34,26 24,22 14,36 20,50 12,60 22,76 18,86 32,70 44,60 54,44 50,34 54","20 44,14 24,28 14,42 20,56 14,66 26,80 20,92 32,70 44,58 38,46 52,32 50,20 54","18 44,10 30,24 18,40 22,56 12,72 20,86 30,70 42,60 36,48 54,34 50,24 54","14 40,10 26,28 18,44 30,50 44,70 52,86 40,90 28,76 22,60 30,50 36,34 42","10 44,8 12,86 8,90 18,72 22,66 28,52 34,30 40,12 38","18 44,12 30,24 16,40 24,52 12,68 20,84 32,74 44,60 38,46 52,30 48,22 44","20 44,12 32,26 20,42 26,56 16,70 24,86 34,76 44,62 36,50 50,36 50,26 48"];
const pathOf=p=>{const n=p.length;let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<n;i++){const a=p[(i+n-1)%n],b=p[i],c=p[(i+1)%n],e=p[(i+2)%n];d+=`C${b[0]+(c[0]-a[0])/6},${b[1]+(c[1]-a[1])/6} ${c[0]-(e[0]-b[0])/6},${c[1]-(e[1]-b[1])/6} ${c[0]},${c[1]}`}return d+'Z'};
let G,R;
const save=()=>{try{localStorage.setItem('f1m26',JSON.stringify(G))}catch(e){}},load=()=>{try{return JSON.parse(localStorage.getItem('f1m26'))}catch(e){return null}};
const fm=t=>{const m=Math.floor(t/60);return m?m+':'+(t%60).toFixed(1).padStart(4,'0'):t.toFixed(1)};
const ln=d=>d.name.split(' ').pop();
function menu(){const s=load();document.documentElement.style.removeProperty('--a');
A.innerHTML=`<main><h1>F1 MANAGER 2026</h1><p class=mut>Choisis ton écurie et dirige-la sur les 24 Grands Prix de la saison.</p>${s?`<p><button class=p onclick="G=load();hub('eq')">Continuer la saison (${T[s.t][0]}, GP ${Math.min(s.r+1,24)}/24)</button></p>`:''}<div class=grid>${T.map((t,i)=>`<div class=card style="border-top:4px solid ${t[1]}"><b>${t[0]}</b><div class=mut>Moteur ${t[3]}</div>${t[4].map(d=>`<div>#${d[1]} ${d[0]} <span class=mut>${d[2]}</span></div>`).join('')}<p><button onclick="newGame(${i})">Diriger</button></p></div>`).join('')}</div>${note}</main>`}
function newGame(i){G={t:i,r:0,$:120,car:T.map(t=>({a:t[2]+ri(-3,3),p:t[2]+ri(-3,3),c:t[2]+ri(-3,3),f:Math.min(97,t[2]+6+ri(-4,3))})),dp:Array(22).fill(0),tp:Array(11).fill(0),w:[]};save();hub('eq')}
const avg=i=>(G.car[i].a+G.car[i].p+G.car[i].c)/3;
function up(k){const c=G.car[G.t],cost=Math.round(4+(c[k]-55)*.3);if(G.$<cost||c[k]>=99)return;G.$-=cost;c[k]=Math.min(99,c[k]+2);save();hub('eq')}
const rank=(arr,i)=>arr.map((v,k)=>[v,k]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]).findIndex(x=>x[1]==i)+1;
const STF=[["Léa Marchand",62,3],["Tom Vasseur",78,5],["Éva Delcourt",92,8]];let UNL=0;
const hire=i=>{G.st=i<0?null:STF[i];save();hub('st')},cp=n=>{G.dp[+$('#cd').value]+=n;G.tp[G.t]+=n;save();hub('st')},unl=()=>{if($('#cc').value=='0000'){UNL=1;hub('st')}else toast('Code incorrect')};
const cheat=()=>UNL?`<h2>Coulisses du staff</h2><div class=grid><div class=card><b>Budget (M$)</b><br><input type=number id=cb value=${Math.round(G.$)} style="width:90px;padding:6px"> <button onclick="G.$=+$('#cb').value;save();hub('st')">Appliquer</button></div>${['a','p','c','f'].map(k=>`<div class=card><b>${{a:'Aérodynamique',p:'Moteur',c:'Châssis',f:'Fiabilité'}[k]}</b> <span id=v${k}>${G.car[G.t][k]}</span><br><input type=range min=40 max=99 value=${G.car[G.t][k]} oninput="G.car[G.t].${k}=+this.value;$('#v${k}').textContent=this.value;save()"></div>`).join('')}<div class=card><b>Course</b><br><label><input type=checkbox ${G.rainF?'checked':''} onchange="G.rainF=this.checked;save()"> Pluie au prochain GP</label><br><label><input type=checkbox ${G.noInc?'checked':''} onchange="G.noInc=this.checked;save()"> Aucun incident ni panne</label></div><div class=card><b>Points</b><br><select id=cd>${D.filter(d=>d.ti==G.t).map(d=>`<option value=${d.id}>${d.name}</option>`).join('')}</select> <button onclick="cp(25)">+25 pts</button></div></div>`:`<h2>Accès staff</h2><p class=mut>Entre le code pour ouvrir les coulisses.</p><input id=cc type=password placeholder="Code" style="padding:7px"> <button onclick="unl()">Valider</button>`;
const V={st:()=>`<h2>Stratèges</h2><p class=mut>Un stratège gère les arrêts et les pneus à ta place pendant la course (noms fictifs). Plus son niveau est haut, mieux il réagit, y compris sous voiture de sécurité. Son salaire est prélevé après chaque GP.</p><div class=grid>${STF.map((x,i)=>`<div class=card><b>${x[0]}</b> <span class=mut>niveau ${x[1]}</span><div class=bar><i style="width:${x[1]}%"></i></div>Salaire ${x[2]} M$ par GP<p>${G.st&&G.st[0]==x[0]?`<button onclick="hire(-1)">Licencier</button>`:`<button class=p onclick="hire(${i})">Engager</button>`}</p></div>`).join('')}</div>${cheat()}`,
eq:()=>{const c=G.car[G.t],n={a:'Aérodynamique',p:'Moteur',c:'Châssis',f:'Fiabilité'};
return `<p>Niveau de la voiture : <b>${rank(T.map((_,i)=>avg(i)),G.t)}e sur 11</b>. Chaque amélioration coûte du budget : gagne des points pour toucher plus de revenus.</p><h2>Développement</h2><div class=grid>${Object.keys(n).map(k=>{const cost=Math.round(4+(c[k]-55)*.3);return `<div class=card><b>${n[k]}</b> <span class=mut>${c[k]}/99</span><div class=bar><i style="width:${c[k]}%"></i></div><button ${G.$<cost||c[k]>=99?'disabled':''} onclick="up('${k}')">+2 pour ${cost} M$</button></div>`}).join('')}</div><h2>Pilotes</h2><div class=grid>${D.filter(d=>d.ti==G.t).map(d=>`<div class=card><b>#${d.n} ${d.name}</b> <span class=mut>${d.nat}</span><br>${G.dp[d.id]} pts · vitesse pure ${d.s[0]} · en course ${d.s[1]}</div>`).join('')}</div>`},
pi:()=>`<h2>Pilotes et statistiques</h2><div class=sc><table><tr><th>#<th>Pilote<th>Nat.<th>Écurie<th>Pure<th>Course<th>Régul.<th>Dépass.<th>Pneus<th>Pluie</tr>${D.map(d=>`<tr class="${d.ti==G.t?'me':''}"><td>${d.n}<td><i class=dot style="background:${T[d.ti][1]}"></i>${d.name}<td>${d.nat}<td>${T[d.ti][0]}${d.s.map(v=>'<td>'+v).join('')}</tr>`).join('')}</table></div>`,
ca:()=>`<h2>Calendrier 2026</h2><div class=sc><table>${CAL.map((c,i)=>`<tr class="${i==G.r?'me':''}"><td>${i+1}<td>${c[0]}<td>${c[1]}<td>${c[2]}<td>${c[3]} tours<td>${G.w[i]?'Vainqueur : '+G.w[i]:i==G.r?'Prochain':''}</tr>`).join('')}</table></div>`,
cl:()=>{const dr=D.map(d=>[d,G.dp[d.id]]).sort((a,b)=>b[1]-a[1]),tm=T.map((t,i)=>[i,G.tp[i]]).sort((a,b)=>b[1]-a[1]);
return `${G.r>=24?`<h2>Champion du monde : ${dr[0][0].name}, Constructeurs : ${T[tm[0][0]][0]}</h2>`:''}<h2>Pilotes</h2><div class=sc><table>${dr.map(([d,p],i)=>`<tr class="${d.ti==G.t?'me':''}"><td>${i+1}<td><i class=dot style="background:${T[d.ti][1]}"></i>${d.name}<td>${p}</tr>`).join('')}</table></div><h2>Constructeurs</h2><div class=sc><table>${tm.map(([i,p],k)=>`<tr class="${i==G.t?'me':''}"><td>${k+1}<td><i class=dot style="background:${T[i][1]}"></i>${T[i][0]}<td>${p}</tr>`).join('')}</table></div>`}};
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),4000)}
function inc(x){const f=G.car[x.d.ti].f,n=ln(x.d),me=x.d.ti==G.t,k=(R.rain?1.8:1)*(G.noInc?0:1),e=(100-x.d.s[2])/50+1,r=Math.random(),a=(.0003+(100-f)*.00003)*k,b=a+.0004*k*e,c=b+.0012*k*e,d=c+.0008*k,g=d+.001*k,h=g+.0006*k;
if(r<a){x.out=R.lap;lg(`Moteur cassé : ${n} abandonne`,me);return 1}
if(R.sc)return 0;
if(r<b){x.out=R.lap;R.sc=4;lg(`Accident : ${n} abandonne, voiture de sécurité`,me);return 1}
if(r<c){x.tot+=ri(8,16);lg(`Tête-à-queue de ${n}`,me)}else if(r<d){if(!x.pit)x.pit=R.rain?'I':x.tyre=='H'?'M':'H';x.tot+=3;lg(`Crevaison pour ${n} : arrêt imposé`,me)}else if(r<g){x.tot+=5;lg(`Pénalité de 5 s pour ${n}`,me)}else if(r<h){x.dg+=.006;lg(`Perte de puissance pour ${n}`,me)}return 0}
V.cl=()=>{const dr=D.map(d=>[d,G.dp[d.id]]).sort((a,b)=>b[1]-a[1]),tm=T.map((t,i)=>[i,G.tp[i]]).sort((a,b)=>b[1]-a[1]),ln2=(c,p,m,t,me,i)=>`<div class="lr ${me?'me':''}" style="--d:${i*30}ms"><b>${i+1}</b><span><i class=dot style="background:${c}"></i>${t}</span><div class=bar><i style="width:${m?p/m*100:0}%;background:${c}"></i></div><b>${p}</b></div>`;
return `${G.r>=24?`<div class=card><h2 style="margin:0">🏆 Champion : ${dr[0][0].name}</h2>Constructeurs : ${T[tm[0][0]][0]}</div>`:''}<div class=two><div><h2>Pilotes</h2>${dr.map(([d,p],i)=>ln2(T[d.ti][1],p,dr[0][1],d.name,d.ti==G.t,i)).join('')}</div><div><h2>Constructeurs</h2>${tm.map(([t,p],i)=>ln2(T[t][1],p,tm[0][1],T[t][0],t==G.t,i)).join('')}</div></div>`};
function hub(tab){clearInterval(R&&R.iv);const t=T[G.t],done=G.r>=24;document.documentElement.style.setProperty('--a',t[1]);
A.innerHTML=`<main><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div><h1 style="margin:0">${t[0]}</h1><span class=mut>Budget ${Math.round(G.$)} M$ — ${done?'Saison terminée':`prochain GP : ${CAL[G.r][0]} (${G.r+1}/24)`}</span></div>${done?`<button class=p onclick="menu()">Nouvelle saison</button>`:`<button class=p onclick="pre()">Aller au Grand Prix</button>`}</div><div class=tabs>${[['eq','Écurie'],['pi','Pilotes'],['ca','Calendrier'],['cl','Classements'],['st','Staff']].map(([k,n])=>`<button class="${k==tab?'on':''}" onclick="hub('${k}')">${n}</button>`).join('')}<button onclick="menu()">Menu</button></div>${V[tab]()}${note}</main>`}
function pre(){const c=CAL[G.r];R={c,lap:0,laps:c[3],base:c[4],rain:!!G.rainF||Math.random()<.2,wet:0,sc:0,log:[],cars:[]};R.wet=R.rain?1:0;
const q=D.map(d=>[d,.6*avg(d.ti)+.4*d.s[0]+(Math.random()-.5)*5]).sort((a,b)=>b[1]-a[1]);
R.cars=q.map(([d],i)=>{const ty=R.rain?'I':['S','M','M','H'][ri(0,3)];return{d,tot:i*.35,tyre:ty,age:0,stops:0,used:{[ty]:1},mode:1,out:0,pit:null,w:0,dg:0,tgt:78+ri(0,18)}});
R.mi=R.cars.map((x,i)=>x.d.ti==G.t?i:-1).filter(i=>i>=0);
const op=v=>['S','M','H','I','W'].map(k=>`<option ${k==v?'selected':''} value=${k}>${{S:'Tendre',M:'Medium',H:'Dur',I:'Intermédiaire',W:'Pluie extrême'}[k]}</option>`).join('');
A.innerHTML=`<main><h1>GP ${c[0]}</h1><p class=mut>${c[1]} — ${c[3]} tours — ${R.rain?'🌧 Piste humide':'☀ Piste sèche'}. En sec, il faut utiliser deux gommes différentes (sinon 20 s de pénalité).</p><h2>Grille de départ</h2><div class=sc><table>${R.cars.map((x,i)=>`<tr class="${x.d.ti==G.t?'me':''}"><td>${i+1}<td><i class=dot style="background:${T[x.d.ti][1]}"></i>#${x.d.n} ${x.d.name}<td>${T[x.d.ti][0]}</tr>`).join('')}</table></div><h2>Pneus de départ</h2><div class=grid>${R.mi.map((m,i)=>`<div class=card><b>${R.cars[m].d.name}</b><br><select id=st${i}>${op(R.cars[m].tyre)}</select></div>`).join('')}</div><p><button class=p onclick="go()">Départ</button> <button onclick="hub('eq')">Retour</button></p></main>`}
function go(){R.mi.forEach((m,i)=>{const x=R.cars[m],t=$('#st'+i).value;x.tyre=t;x.used={[t]:1};x.tgt=78+ri(0,18)});
const op=['S','M','H','I','W'].map(k=>`<option value=${k}>${{S:'Tendre',M:'Medium',H:'Dur',I:'Intermédiaire',W:'Pluie extrême'}[k]}</option>`).join('');
A.innerHTML=`<main><h1 style="margin:0">GP ${R.c[0]}</h1><div>Tour <b id=lp>0</b>/${R.laps} — <span id=sts></span></div><p><button onclick="sp(0)">×1</button> <button onclick="sp(1)">×4</button> <button onclick="sp(2)">×16</button> <button class=p onclick="while(!R.fin)tick()">Terminer la course</button> ${G.st?`<label><input type=checkbox onchange="R.auto=this.checked"> Stratège ${G.st[0]} en pilotage auto</label>`:''}</p><div class=grid>${R.mi.map((m,i)=>`<div class=card><b>#${R.cars[m].d.n} ${R.cars[m].d.name}</b><br>Allure <select onchange="R.cars[${m}].mode=+this.value"><option value=0>Attaque</option><option value=1 selected>Normal</option><option value=2>Économie</option></select><br>Prochains pneus <select id=nx${i}>${op}</select><br><button id=bx${i} onclick="box(${m},${i})">Box au prochain tour</button></div>`).join('')}</div><div class=two><div class=card><svg id=map viewBox="0 0 100 60" width=100%></svg><div class=mut>${R.c[1]} : tracé schématique, non à l'échelle. Cercle blanc : ton écurie.</div></div><div class=card><div id=tw style="position:relative;height:616px"></div></div></div><p class=mut id=lg></p></main>`;
R.fin=0;initMap();draw();sp(0);anim()}
function initMap(){$('#tw').innerHTML=R.cars.map((x,i)=>`<div class=rw id=r${i}></div>`).join('');const d=pathOf(MAP[G.r].split(',').map(p=>p.split(' ').map(Number)));
$('#map').innerHTML=`<path d="${d}" fill=none stroke="#2a2e36" stroke-width=5.5 stroke-linejoin=round /><path id=tp d="${d}" fill=none stroke="#5b616c" stroke-width=3.6 stroke-linejoin=round /><circle id=sf r=1.3 fill="#fff" />${R.cars.map((x,i)=>{const m=x.d.ti==G.t;return `<g id=c${i}><title>#${x.d.n} ${x.d.name}</title><circle r=${m?2.8:1.7} fill="${T[x.d.ti][1]}" ${m?'stroke="#fff" stroke-width=.7':''} />${m?`<text y=1>${x.d.n}</text>`:''}</g>`}).join('')}`;
R.trk=$('#tp');R.len=R.trk.getTotalLength();const s=R.trk.getPointAtLength(0);$('#sf').setAttribute('cx',s.x);$('#sf').setAttribute('cy',s.y);R.el=R.cars.map((x,i)=>$('#c'+i));R.ms=700}
function anim(){if(R.fin)return;const k=Math.min(1,(performance.now()-R.t0)/R.ms);
R.cars.forEach((x,i)=>{const e=R.el[i];if(x.out){e.style.display='none';return}x.pd=x.pa+(x.pb-x.pa)*k;const p=R.trk.getPointAtLength((((x.pd%1)+1)%1)*R.len);e.setAttribute('transform',`translate(${p.x} ${p.y})`)});requestAnimationFrame(anim)}
const sp=i=>{clearInterval(R.iv);R.ms=[700,180,40][i];R.iv=setInterval(tick,R.ms)};
function box(m,i){const x=R.cars[m];x.pit=x.pit?null:$('#nx'+i).value;draw()}
const lg=(m,me)=>{R.log.unshift(`Tour ${R.lap} : ${m}`);R.log=R.log.slice(0,6);if(me)toast(m)};
function lapT(x){const car=G.car[x.d.ti],s=x.d.s,b=R.base,k=C[x.tyre],dm=[1.35,1,.75][x.mode];
let lt=b*(1+(100-(.6*avg(x.d.ti)+.4*s[1]))*.0006+k.o);
lt+=b*k.d*k.l*(x.w/100)+(x.w>85?b*.0008*(x.w-85):0)+x.dg*b;
lt-=b*(R.laps-R.lap)*.00008;
if(R.rain)lt+=b*((x.tyre=='I'?.12:x.tyre=='W'?.15:.35)-(s[5]-80)*.001);else if(x.tyre=='I'||x.tyre=='W')lt+=b*.14;
return (lt+(Math.random()-.5)*(.3+(100-s[2])*.02))*(1+[-.004,0,.005][x.mode])}
function ai(x){if(x.d.ti==G.t&&R.sc&&G.st&&G.st[1]>=75&&x.w>45&&R.laps-R.lap>6&&!x.pit&&x.tyre!='I'&&x.tyre!='W'){x.pit=R.laps-R.lap>30?'H':'M';return}const rem=R.laps-R.lap,dry=Object.keys(x.used).filter(k=>k!='I').length;
if(R.rain&&x.tyre!='I'&&rem>3)x.pit='I';else if(!R.rain&&x.tyre=='I'&&Math.random()<.4)x.pit='M';
else if(x.tyre!='I'&&rem>4&&(x.w>=x.tgt||(dry<2&&!R.rain&&!R.wet&&R.lap>=R.laps*.55))){x.pit=rem>34?'H':rem>14?'M':'S';if(!R.wet&&dry<2&&x.used[x.pit])x.pit=['S','M','H'].find(k=>!x.used[k])}}
function tick(){if(R.fin)return;R.lap++;
if(!R.rain&&Math.random()<.004){R.rain=1;R.wet=1;lg('🌧 Il commence à pleuvoir')}else if(R.rain&&Math.random()<.02){R.rain=0;lg('☀ La piste sèche')}
const L=R.cars.filter(x=>!x.out).sort((a,b)=>a.tot-b.tot);
if(R.sc){R.sc--;if(!R.sc)lg('🟢 Reprise de la course')}else if(R.lap>1&&R.lap<R.laps-2&&Math.random()<R.c[5]){R.sc=4;lg('🟡 Voiture de sécurité');L.forEach((x,i)=>x.tot=L[0].tot+i*.8)}
let pv=null;
L.forEach(x=>{if(inc(x))return;
if((x.d.ti!==G.t||R.auto)&&!x.pit)ai(x);
let lt=R.sc?R.base*1.4:lapT(x);
if(x.pit){lt+=21*(R.sc?.55:1);x.tyre=x.pit;x.pit=null;x.age=0;x.w=0;x.stops++;x.used[x.tyre]=1;x.tgt=78+ri(0,18)}
x.age++;x.w=Math.min(130,x.w+100/C[x.tyre].l*[1.35,1,.75][x.mode]*(1.25-x.d.s[4]/200)*(R.sc?.4:1)*((R.rain?(x.tyre=='I'||x.tyre=='W'):(x.tyre!='I'&&x.tyre!='W'))?1:1.8));x.lt=lt;x.nt=x.tot+lt;
if(pv){const lim=pv.nt+.3;if(R.sc)x.nt=Math.max(x.nt,lim);else if(x.nt<lim){const P=Math.min(.9,R.c[6]*(.4+x.d.s[3]/100)*(1+Math.max(0,pv.lt-x.lt)*1.5));if(Math.random()>=P)x.nt=lim}}
pv=x});
L.forEach(x=>{if(!x.out)x.tot=x.nt});
draw();if(R.lap>=R.laps)fin()}
function draw(){const live=R.cars.filter(x=>!x.out).sort((a,b)=>a.tot-b.tot),ko=R.cars.filter(x=>x.out),l0=live[0].tot;
const lav=live[0].lt||R.base;R.t0=performance.now();
R.cars.forEach(x=>{if(x.out)return;const pt=R.lap-(x.tot-l0)/lav;x.pa=x.pd===undefined?pt:x.pd;x.pb=pt});
$('#lp').textContent=R.lap;$('#sts').textContent=(R.sc?'🟡 Voiture de sécurité':'🟢 Course')+(R.rain?' — 🌧 Pluie':' — ☀ Sec');
R.mi.forEach((m,i)=>{$('#bx'+i).textContent=R.cars[m].pit?'Box confirmé : annuler':'Box au prochain tour';$('#bx'+i).disabled=!!R.cars[m].out});
R.cars.forEach((x,i)=>{const e=$('#r'+i),p=x.out?live.length+ko.indexOf(x):live.indexOf(x);e.style.transform=`translateY(${p*28}px)`;e.className='rw'+(x.d.ti==G.t?' me':'')+(x.out?' ko':'');e.innerHTML=`<b>${x.out?'-':p+1}</b><i class=dot style="background:${T[x.d.ti][1]}"></i><span class=nm>${ln(x.d)}</span><span class=gp>${x.out?'Abandon':p?'+'+fm(x.tot-l0):'Leader'}</span><span><i class="ty ${x.tyre}">${x.tyre}</i>${Math.round(x.w)}%</span>`});
$('#lg').innerHTML=R.log.join('<br>')}
function fin(){R.fin=1;clearInterval(R.iv);
R.cars.forEach(x=>{if(!x.out&&!R.wet&&Object.keys(x.used).filter(k=>k!='I').length<2){x.tot+=20;x.pen=1}});
const cl=[...R.cars.filter(x=>!x.out).sort((a,b)=>a.tot-b.tot),...R.cars.filter(x=>x.out).sort((a,b)=>b.out-a.out)];let mine=0;
cl.forEach((x,i)=>{const p=x.out?0:PTS[i]||0;G.dp[x.d.id]+=p;G.tp[x.d.ti]+=p;if(x.d.ti==G.t)mine+=p});
T.forEach((t,i)=>{if(i!=G.t&&Math.random()<.5){const k='apcf'[ri(0,3)];G.car[i][k]=Math.min(99,G.car[i][k]+1)}});
const rk=rank(G.tp,G.t),gain=Math.round(6+(11-rk)*1.8+mine*.4-5-(G.st?G.st[2]:0));G.$+=gain;G.w[G.r]=ln(cl[0].d);G.r++;save();
A.innerHTML=`<main><h1>Résultats du GP ${R.c[0]}</h1><div class=sc><table>${cl.map((x,i)=>`<tr class="${x.d.ti==G.t?'me':''}"><td>${x.out?'-':i+1}<td><i class=dot style="background:${T[x.d.ti][1]}"></i>${x.d.name}<td>${T[x.d.ti][0]}<td>${x.out?'Abandon (tour '+x.out+')':(i?'+'+fm(x.tot-cl[0].tot):'Vainqueur')+(x.pen?' (+20 s, une seule gomme)':'')}<td>${x.out?0:PTS[i]||0} pts</tr>`).join('')}</table></div><p>Ton écurie : <b>${mine} pts</b>, ${rk}e au championnat constructeurs. Bilan financier : <b>${gain>=0?'+':''}${gain} M$</b> (revenus moins coûts).</p><p><button class=p onclick="hub('eq')">Retour au QG</button> <button onclick="hub('cl')">Classements</button></p></main>`}
menu();
</script></body></html>
